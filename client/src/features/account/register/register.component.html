<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">
        Sign Up
    </div>

    <div class="card-body w-full">
       <form [formGroup]="registerForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
        
        <app-text-input label="Email" formControlName="email" placeholder="Email"/>
        <app-text-input label="Display name" formControlName="displayName" placeholder="Display Name"/>
        <app-text-input label="Password" formControlName="password" type="password" placeholder="Password"/>
        <app-text-input label="Confirm Password" formControlName="confirmPassword" type="password" placeholder="Confirm Password"/>
